name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problems go to the private advisory form, not here."
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "24.11.0"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows the problem.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
