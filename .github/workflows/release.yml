name: Release

# Conventional commits on main → release-please keeps one "chore(main):
# release x.y.z" pull request up to date (version bump + CHANGELOG). Merging
# it tags the release, and the publish job ships that exact commit to npm
# through npm Trusted Publishing (OIDC): no npm token exists anywhere.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # Optional: a GitHub App token lets CI run on the release pull request
      # (pull requests opened with GITHUB_TOKEN do not trigger workflows).
      # Set the RELEASE_APP_ID variable and RELEASE_APP_PRIVATE_KEY secret to
      # enable it; without them the workflow falls back to GITHUB_TOKEN.
      - id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build and test WITHOUT the OIDC permission: this job runs every dev
  # dependency (test runner, compiler, linter), and none of them may ever
  # be able to request the publish token.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: mkdir -p out && npm pack --pack-destination out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: out/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Publishes the tarball built above. It installs nothing and runs no
  # project code, so the OIDC token is only ever seen by npm itself.
  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Protected environment: add required reviewers in Settings → Environments
    # so a person approves every publish.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@gydr-ai/safe-fetch
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing + provenance
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          # The only hosts the publish job may reach: GitHub (artifact,
          # OIDC token), the npm registry, and Sigstore (provenance).
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: out

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or later. Node 24 bundles it, so
      # nothing is downloaded into this privileged job; fail if that changes.
      - name: Check bundled npm
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number)
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))
            if (!ok) { console.error("npm " + process.argv[1] + " is too old for trusted publishing"); process.exit(1) }
          ' "$(npm --version)"

      - run: npm publish out/*.tgz --access public
