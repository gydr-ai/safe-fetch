name: Release

# Conventional commits on main → release-please keeps one "chore(main):
# release x.y.z" pull request up to date (version bump + CHANGELOG). Merging
# it tags the release, and the publish job ships that exact commit to npm
# through npm Trusted Publishing (OIDC): no npm token exists anywhere.
#
# If publishing fails after the tag exists, run this workflow by hand on
# main with that tag (Actions → Release → Run workflow) to stage the same
# tagged commit again. It cannot create a tag or a version.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish again (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # Optional: a GitHub App token lets CI run on the release pull request
      # (pull requests opened with GITHUB_TOKEN do not trigger workflows).
      # Set the RELEASE_APP_ID variable and RELEASE_APP_PRIVATE_KEY secret to
      # enable it; without them the workflow falls back to GITHUB_TOKEN.
      - id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build and test WITHOUT the OIDC permission: this job runs every dev
  # dependency (test runner, compiler, linter), and none of them may ever
  # be able to request the publish token.
  build:
    needs: release-please
    # On a manual run release-please is skipped, so `always()` lets this job
    # run; it still never runs after a failed or cancelled release-please.
    if: >-
      always() && !cancelled() && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # The tag must look like a release tag; it is passed through the
      # environment, never interpolated into the script.
      - name: Check tag
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Not a release tag: $TAG"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Check version matches tag
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$TAG" ]; then
            echo "package.json version $version does not match tag $TAG"
            exit 1
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Newest patch, not the runner's cached one: security releases land
          # days before runner images update.
          check-latest: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: mkdir -p out && npm pack --pack-destination out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: out/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Publishes the tarball built above. It installs nothing and runs no
  # project code, so the OIDC token is only ever seen by npm itself.
  publish:
    needs: [release-please, build]
    if: always() && !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Protected environment: add required reviewers in Settings → Environments
    # so a person approves every publish.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@gydr-ai/safe-fetch
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing + provenance
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          # The only hosts the publish job may reach: GitHub (artifact,
          # OIDC token), the npm registry, and Sigstore (provenance).
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: out

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Newest patch, not the runner's cached one: security releases land
          # days before runner images update.
          check-latest: true
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15.0 or later (trusted publishing
      # 11.5.1). Node 24 bundles it, so nothing is downloaded into this
      # privileged job; fail if that changes.
      - name: Check bundled npm
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number)
            const ok = major > 11 || (major === 11 && minor >= 15)
            if (!ok) { console.error("npm " + process.argv[1] + " is too old for staged publishing"); process.exit(1) }
          ' "$(npm --version)"

      # Staged publishing: the trusted publisher on npm allows only
      # `npm stage publish`, so this run can only queue the version. It goes
      # live when a maintainer approves it on npm with 2FA (RELEASING.md).
      # The `./` matters: without it npm reads `out/name.tgz` as a GitHub
      # `owner/repo` shorthand and tries to clone it over git.
      - run: npm stage publish ./out/*.tgz --access public --provenance
